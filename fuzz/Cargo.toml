[package]
name = "fujicli-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fujicli]
path = ".."
features = ["fuzzing"]

# Keep the fuzz crate out of the parent workspace.
[workspace]

[[bin]]
name = "ptp_descriptor"
path = "fuzz_targets/ptp_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ptp_object_info"
path = "fuzz_targets/ptp_object_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ptp_device_info"
path = "fuzz_targets/ptp_device_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ptp_container_info"
path = "fuzz_targets/ptp_container_info.rs"
test = false
doc = false
bench = false
