[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # log4rs -> rand still uses getrandom 0.3, while tempfile uses 0.4.
    { name = "getrandom", version = "=0.3.4" },
    # This is the target-specific companion of the reviewed getrandom 0.3 split.
    { name = "r-efi", version = "=5.3.0" },
    # Several derive dependencies still use syn 2 while codegen and clap use syn 3.
    { name = "syn", version = "=2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
