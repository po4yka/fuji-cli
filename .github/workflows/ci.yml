name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: CI / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish libusb-1.0-0-dev mandoc pkg-config zsh

      - name: Install CUE
        run: |
          bash support/install-cue.sh "$RUNNER_TEMP/cue-bin"
          printf '%s\n' "$RUNNER_TEMP/cue-bin" >>"$GITHUB_PATH"

      - name: Test release packaging
        run: python3 -m unittest support/test_package_release.py -v

      - name: Validate completion and man assets
        run: |
          bash -n assets/share/bash-completion/completions/fujicli
          bash --noprofile --norc -c 'source assets/share/bash-completion/completions/fujicli; complete -p fujicli >/dev/null'
          zsh -n assets/share/zsh/site-functions/_fujicli
          zsh -f -c 'autoload -Uz compinit; compinit -D; source assets/share/zsh/site-functions/_fujicli; (( $+functions[_fujicli] ))'
          fish -n assets/share/fish/vendor_completions.d/fujicli.fish
          fish --no-config -c 'source assets/share/fish/vendor_completions.d/fujicli.fish; test (count (complete --command fujicli)) -gt 0'
          for page in assets/share/man/man1/*.1; do mandoc -T utf8 "$page" >/dev/null; done

      - name: Install cargo-udeps
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-udeps@0.1.61
          fallback: none

      - name: Install typos
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: typos@1.50.0
          fallback: none

      - name: Check spelling
        run: typos . .github

      - name: Check all targets
        run: cargo check --locked --all-features --all-targets --workspace --jobs 4

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked --all-features --all-targets --workspace --jobs 4 -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps --jobs 4

      - name: Test all targets
        run: cargo test --locked --all-features --all-targets --workspace --jobs 4

      - name: Build workspace
        run: cargo build --locked --workspace --jobs 4

      - name: Detect unused dependencies
        run: cargo udeps --locked --workspace --all-features --all-targets --jobs 4

  platform:
    name: CI / Platform (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-15-intel
          - name: Windows x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CUE
        shell: bash
        run: |
          bash support/install-cue.sh "$RUNNER_TEMP/cue-bin"
          printf '%s\n' "$RUNNER_TEMP/cue-bin" >>"$GITHUB_PATH"

      - name: Test all targets
        run: cargo test --locked --all-features --all-targets --workspace --jobs 4

      - name: Build workspace
        run: cargo build --locked --workspace --jobs 4

      - name: Validate PowerShell completion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'assets/share/powershell/Completions/fujicli.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  coverage:
    name: CI / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE
        run: |
          bash support/install-cue.sh "$RUNNER_TEMP/cue-bin"
          printf '%s\n' "$RUNNER_TEMP/cue-bin" >>"$GITHUB_PATH"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none

      - name: Report coverage summary
        run: cargo llvm-cov --workspace --all-features --locked --jobs 4 --summary-only >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: CI / Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lychee
        run: |
          bash support/install-lychee.sh "$RUNNER_TEMP/lychee-bin"
          printf '%s\n' "$RUNNER_TEMP/lychee-bin" >>"$GITHUB_PATH"

      - name: Check documentation links
        run: lychee --offline --include-fragments=anchor-only --no-progress 'docs/**/*.md'

  nix:
    name: CI / Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build fujicli package
        run: nix build .#packages.x86_64-linux.fujicli --no-update-lock-file --print-build-logs

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs
