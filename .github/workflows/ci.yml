name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: CI / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.16.1

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --locked --all-features --all-targets --workspace --jobs 4

      - name: Lint all targets
        run: cargo clippy --locked --all-features --all-targets --workspace --jobs 4 -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-features --all-targets --workspace --jobs 4

      - name: Build workspace
        run: cargo build --locked --workspace --jobs 4

  nix:
    name: CI / Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs
