name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release / validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      release-label: ${{ steps.metadata.outputs.release-label }}
      release-version: ${{ steps.metadata.outputs.release-version }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "fujicli") | .version')"
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_label="$REF_NAME"
            release_version="${REF_NAME#v}"
          else
            release_label="v${cargo_version}-rehearsal-${GITHUB_SHA::12}"
            release_version="$cargo_version"
          fi
          printf 'release-label=%s\n' "$release_label" >>"$GITHUB_OUTPUT"
          printf 'release-version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag is not strict SemVer: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release commit is not part of origin/main: $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE
        run: |
          bash support/install-cue.sh "$RUNNER_TEMP/cue-bin"
          printf '%s\n' "$RUNNER_TEMP/cue-bin" >>"$GITHUB_PATH"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Match Cargo, Nix, and tag versions
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release-version }}
        run: |
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "fujicli") | .version')"
          nix_version="$(nix eval --raw .#packages.x86_64-linux.fujicli.version)"

          if [[ "$RELEASE_VERSION" == "$cargo_version" && "$RELEASE_VERSION" == "$nix_version" ]]; then
            printf 'release version: %s\n' "$RELEASE_VERSION"
          else
            printf 'version mismatch: requested=%s cargo=%s nix=%s\n' "$RELEASE_VERSION" "$cargo_version" "$nix_version" >&2
            exit 1
          fi

      - name: Check all targets
        run: cargo check --locked --all-features --all-targets --workspace --jobs 4

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked --all-features --all-targets --workspace --jobs 4 -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps --jobs 4

      - name: Test all targets
        run: cargo test --locked --all-features --all-targets --workspace --jobs 4

  package:
    name: Release / package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: fujicli
          - name: macOS arm64
            os: macos-15-arm64
            target: aarch64-apple-darwin
            binary: fujicli
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: fujicli.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE on Linux
        if: runner.os == 'Linux'
        run: |
          bash support/install-cue.sh "$RUNNER_TEMP/cue-bin"
          printf '%s\n' "$RUNNER_TEMP/cue-bin" >>"$GITHUB_PATH"

      - name: Install CUE on macOS and Windows
        if: runner.os != 'Linux'
        shell: bash
        run: |
          go install cuelang.org/go/cmd/cue@v0.16.1
          printf '%s\n' "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --locked --release --all-features --workspace --target ${{ matrix.target }} --jobs 2

      - name: Smoke-test binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Inspect Linux linkage
        if: runner.os == 'Linux'
        run: ldd target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Stage deterministic archive
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          RELEASE_LABEL: ${{ needs.validate.outputs.release-label }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          package="fujicli-${RELEASE_LABEL}-${RELEASE_TARGET}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          "$PYTHON" support/package-release.py \
            --binary "target/${RELEASE_TARGET}/release/${RELEASE_BINARY}" \
            --license LICENSE \
            --package "$package" \
            --output "dist/$package.zip" \
            --epoch "$source_date_epoch"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          format: spdx-json
          output-file: dist/fujicli-${{ needs.validate.outputs.release-label }}-${{ matrix.target }}.spdx.json
          syft-version: 1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / publish
    if: github.event_name == 'push'
    needs:
      - validate
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release
    permissions:
      artifact-metadata: write # Record attested release assets.
      attestations: write # Store provenance and SBOM attestations.
      contents: write # Create the GitHub release and upload its assets.
      id-token: write # Obtain the short-lived Sigstore signing identity.
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Generate and verify checksums
        working-directory: dist
        run: |
          sha256sum ./*.zip ./*.spdx.json >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest Linux SBOM
        id: sbom-linux
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*-x86_64-unknown-linux-gnu.zip
          sbom-path: dist/*-x86_64-unknown-linux-gnu.spdx.json

      - name: Attest macOS SBOM
        id: sbom-macos
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*-aarch64-apple-darwin.zip
          sbom-path: dist/*-aarch64-apple-darwin.spdx.json

      - name: Attest Windows SBOM
        id: sbom-windows
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*-x86_64-pc-windows-msvc.zip
          sbom-path: dist/*-x86_64-pc-windows-msvc.spdx.json

      - name: Include attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          LINUX_SBOM_BUNDLE: ${{ steps.sbom-linux.outputs.bundle-path }}
          MACOS_SBOM_BUNDLE: ${{ steps.sbom-macos.outputs.bundle-path }}
          WINDOWS_SBOM_BUNDLE: ${{ steps.sbom-windows.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/provenance.sigstore.json
          cp "$LINUX_SBOM_BUNDLE" dist/linux-sbom.sigstore.json
          cp "$MACOS_SBOM_BUNDLE" dist/macos-sbom.sigstore.json
          cp "$WINDOWS_SBOM_BUNDLE" dist/windows-sbom.sigstore.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --title "fujicli $RELEASE_TAG"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          while read -r _ asset; do
            gh release verify-asset "$RELEASE_TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
          done <dist/SHA256SUMS
