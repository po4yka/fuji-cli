name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release / validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag is not strict SemVer: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release commit is not part of origin/main: $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.16.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Match Cargo, Nix, and tag versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "fujicli") | .version')"
          nix_version="$(nix eval --raw .#packages.x86_64-linux.fujicli.version)"

          if [[ "$tag_version" != "$cargo_version" || "$tag_version" != "$nix_version" ]]; then
            printf 'version mismatch: tag=%s cargo=%s nix=%s\n' "$tag_version" "$cargo_version" "$nix_version" >&2
            exit 1
          fi

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --locked --all-features --all-targets --workspace --jobs 4

      - name: Lint all targets
        run: cargo clippy --locked --all-features --all-targets --workspace --jobs 4 -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-features --all-targets --workspace --jobs 4

  package:
    name: Release / package Linux x86_64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      - name: Install CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.16.1

      - name: Build release binary
        run: cargo build --locked --release --all-features --workspace --target x86_64-unknown-linux-gnu --jobs 2

      - name: Smoke-test binary and inspect linkage
        run: |
          target/x86_64-unknown-linux-gnu/release/fujicli --version
          target/x86_64-unknown-linux-gnu/release/fujicli --help >/dev/null
          ldd target/x86_64-unknown-linux-gnu/release/fujicli

      - name: Stage deterministic archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="fujicli-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          stage="$RUNNER_TEMP/$package"
          mkdir -p "$stage" dist
          install -m 0755 target/x86_64-unknown-linux-gnu/release/fujicli "$stage/fujicli"
          install -m 0644 LICENSE "$stage/LICENSE"

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$RUNNER_TEMP" \
            -cf - \
            "$package" | gzip -n >"dist/$package.tar.gz"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/fujicli-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          format: spdx-json
          output-file: dist/fujicli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.spdx.json
          syft-version: 1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.spdx.json >SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / publish
    needs:
      - validate
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release
    permissions:
      artifact-metadata: write # Record attested release assets.
      attestations: write # Store provenance and SBOM attestations.
      contents: write # Create the GitHub release and upload its assets.
      id-token: write # Obtain the short-lived Sigstore signing identity.
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/*.spdx.json

      - name: Include attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/provenance.sigstore.json
          cp "$SBOM_BUNDLE" dist/sbom.sigstore.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --title "fujicli $RELEASE_TAG"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          while read -r _ asset; do
            gh release verify-asset "$RELEASE_TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
          done <dist/SHA256SUMS
