name: Feature request
description: Propose a user-visible outcome or workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Camera capabilities require physical evidence; a nearby model, fixture, or generated schema is not proof.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to accomplish, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without prescribing internal architecture.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Show a concise command or interaction if it clarifies the request.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related tools you have tried.
  - type: textarea
    id: safety
    attributes:
      label: Camera and data-safety considerations
      description: Note whether the request reads or mutates camera state and what physical evidence exists.
  - type: checkboxes
    id: checks
    attributes:
      label: Public-report checks
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: I removed serial numbers, private files, backup artifacts, secrets, and unreviewed verbose logs.
          required: true
