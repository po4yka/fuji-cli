[package]
name = "fujicli-dev"
version = "0.2.0"
edition = "2024"
description = "Unpublished read-only reverse-engineering CLI for fuji-cli contributors"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
default = []
reverse-tools = ["fujicli/reverse-tools"]

[[bin]]
name = "fujicli-dev"
path = "src/main.rs"
required-features = ["reverse-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
fujicli = { path = "../..", default-features = false }
log = "0.4.34"
log4rs = "1.4.0"
rusb = "0.9.4"
tempfile = "3.27.0"
