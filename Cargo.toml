[workspace]
members = [".", "crates/codegen", "crates/fujicli-dev"]
default-members = ["."]
resolver = "2"

[workspace.lints.rust]
let_underscore_drop = "deny"
non_ascii_idents = "deny"
unconditional_recursion = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
panic = "deny"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
todo = "deny"
uninlined_format_args = "warn"
unimplemented = "deny"
unnested_or_patterns = "warn"
unwrap_used = "deny"
unused_self = "warn"

[package]
name = "fujicli"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "A fail-closed CLI for inspecting Fujifilm cameras and verified USB/PTP backup workflows"
readme = "README.md"
license = "MIT"
repository = "https://github.com/po4yka/fuji-cli"
authors = ["Nikita Pochaev"]
build = "build.rs"

[lints]
workspace = true

[lib]
name = "fujicli"
path = "src/lib/mod.rs"

[features]
default = []
reverse-tools = []
dangerous-reverse-engineering = ["reverse-tools"]

[[bin]]
name = "fujicli"
path = "src/main.rs"

[build-dependencies]
anyhow = "1.0.104"
codegen = { path = "crates/codegen", version = "0.1.0" }

[profile.release]
panic = 'abort'
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
binrw = { version = "0.15.2", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.6"
ctrlc = "3.5"
log = "0.4.34"
log4rs = "1.4.0"
num_enum = "0.7.6"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
erased-serde = "0.4.10"
serde_with = "3.22.0"
tempfile = "3.27.0"

[dev-dependencies]
clap_mangen = "=0.3.3"
